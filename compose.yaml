services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: miniflux
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
  
  miniflux:
    image: miniflux/miniflux:2.2.10
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://miniflux:${POSTGRES_PASSWORD}@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CLEANUP_ARCHIVE_READ_DAYS: 60
      CLEANUP_ARCHIVE_UNREAD_DAYS: 180
      CLEANUP_REMOVE_SESSIONS_DAYS: 30
    networks:
      - backend
    mem_limit: 256m

networks:
  backend:

volumes:
  db_data:
